<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <!-- 引入Markdown解析库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <title>鲁虺文本内容搜索展示系统</title>
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Consolas', 'Monaco', monospace;
            background-color: #f5f5f5;
            padding: 1rem;
            border-radius: 4px;
            margin: 1rem 0;
        }
        .markdown-content h1, .markdown-content h2, .markdown-content h3 {
            font-weight: bold;
            margin: 1.5rem 0 1rem;
        }
        .markdown-content h1 { font-size: 1.8rem; }
        .markdown-content h2 { font-size: 1.5rem; }
        .markdown-content h3 { font-size: 1.2rem; }
        .markdown-content p { margin-bottom: 1rem; }
        .markdown-content ul, .markdown-content ol { 
            margin-left: 1.5rem; 
            margin-bottom: 1rem;
        }
        .markdown-content ul { list-style-type: disc; }
        .markdown-content ol { list-style-type: decimal; }
        .markdown-content blockquote {
            border-left: 4px solid #ddd;
            padding-left: 1rem;
            margin: 1rem 0;
            color: #666;
        }
        .markdown-content a { color: #3b82f6; text-decoration: underline; }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            border-top-color: #3b82f6;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .nav-link.active {
            color: #1e40af;
            font-weight: bold;
            text-decoration: underline;
        }
        .error-message {
            background-color: #fee2e2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 1rem;
            border-radius: 4px;
            margin: 1rem 0;
        }
        .search-option {
            border: 1px solid #ddd;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .search-option:hover {
            background-color: #f0f0f0;
        }
        .search-option.active {
            background-color: #e6f4ff;
            border-color: #91c9ff;
        }
        .search-hit {
            background-color: #fff3cd;
            padding: 0 2px;
            border-radius: 2px;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div class="container mx-auto p-4 md:p-8 max-w-6xl">
        <header class="mb-8">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">
                        <a href="index.html" class="hover:text-blue-600 transition">鲁虺文本内容搜索展示系统</a>
                    </h1>
                    <p class="text-gray-600">高效检索与展示各类文本内容</p>
                </div>
                <button id="home-button" class="bg-green-500 text-white p-2 rounded-md hover:bg-green-600 transition self-start">
                    <i class="fas fa-home mr-1"></i> 返回首页
                </button>
            </div>
        </header>
        
        <div class="mb-6">
            <div class="flex flex-col md:flex-row gap-3">
                <input type="text" id="search-input" placeholder="搜索文章标题或内容..."
                    class="border border-gray-300 p-2 rounded-md flex-grow focus:outline-none focus:ring-2 focus:ring-blue-500">
                <div class="relative">
                    <button id="search-button" class="bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition">
                        <i class="fas fa-search mr-1"></i> 搜索
                    </button>
                    <button id="search-options-button" class="ml-2 bg-gray-200 text-gray-700 p-2 rounded-md hover:bg-gray-300 transition">
                        <i class="fas fa-sliders-h"></i>
                    </button>
                    <!-- 搜索选项下拉框 -->
                    <div id="search-options" class="hidden absolute right-0 mt-2 w-48 bg-white shadow-lg rounded-md z-10 p-2">
                        <div class="search-option active" data-option="title">
                            <label class="flex items-center">
                                <input type="radio" name="search-type" value="title" checked class="mr-2">
                                <span>标题搜索</span>
                            </label>
                        </div>
                        <div class="search-option" data-option="content">
                            <label class="flex items-center">
                                <input type="radio" name="search-type" value="content" class="mr-2">
                                <span>内容搜索</span>
                            </label>
                        </div>
                        <div class="search-option" data-option="both">
                            <label class="flex items-center">
                                <input type="radio" name="search-type" value="both" class="mr-2">
                                <span>标题和内容</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 搜索信息显示 -->
            <div id="search-info" class="mt-2 text-sm text-gray-500 hidden">
                <span>搜索范围: </span>
                <span id="search-scope-text">标题</span>
                <span id="search-results-count" class="ml-2"></span>
            </div>
        </div>
        
        <!-- 分类导航 -->
        <div id="category-nav" class="mb-6 overflow-x-auto pb-2">
            <div class="flex space-x-4 min-w-max">
                <!-- 分类导航链接将在这里动态生成 -->
            </div>
        </div>
        
        <!-- 分类统计 -->
        <div id="category-stats" class="mb-6 p-4 bg-white rounded-lg shadow-sm">
            <!-- 统计信息将在这里动态生成 -->
        </div>
        
        <!-- 加载状态 -->
        <div id="loading-indicator" class="hidden mb-6 text-center">
            <div class="loading mx-auto"></div>
            <p class="text-gray-600 mt-2">正在加载内容...</p>
        </div>
        
        <!-- 错误信息 -->
        <div id="error-container" class="hidden mb-6">
            <div id="error-message" class="error-message">
                <!-- 错误信息将在这里显示 -->
            </div>
        </div>
        
        <!-- 文章列表容器 -->
        <div id="article-list-container" class="mb-8">
            <div id="article-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 文章列表将在这里动态生成 -->
            </div>
            
            <!-- 分页控件 -->
            <div id="pagination" class="flex flex-wrap justify-center gap-2 mt-6">
                <!-- 分页按钮将在这里动态生成 -->
            </div>
        </div>
    </div>
    
    <!-- 文章详情页 -->
    <div id="article-detail" class="container mx-auto p-4 md:p-8 max-w-4xl hidden">
        <div class="flex flex-wrap gap-3 mb-6">
            <button id="back-button" class="inline-flex items-center bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition">
                <i class="fas fa-arrow-left mr-2"></i> 返回列表
            </button>
            <button id="home-button-detail" class="inline-flex items-center bg-green-500 text-white p-2 rounded-md hover:bg-green-600 transition">
                <i class="fas fa-home mr-2"></i> 返回首页
            </button>
        </div>
        
        <div class="bg-white p-6 rounded-lg shadow-sm mb-6">
            <h2 id="article-title" class="text-2xl md:text-3xl font-bold mb-4 text-gray-800"></h2>
            <div id="article-meta" class="text-gray-500 text-sm mb-6">
                <!-- 文章元数据将在这里显示 -->
            </div>
            <div id="article-content" class="markdown-content text-gray-700 leading-relaxed">
                <!-- 文章内容将在这里显示 -->
            </div>
        </div>
        
        <div class="flex justify-between">
            <button id="prev-article-button" class="bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition">
                <i class="fas fa-chevron-left mr-1"></i> 上一篇
            </button>
            <button id="next-article-button" class="bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition">
                下一篇 <i class="fas fa-chevron-right ml-1"></i>
            </button>
        </div>
    </div>

    <script>
        // DOM元素
        const articleList = document.getElementById('article-list');
        const articleDetail = document.getElementById('article-detail');
        const articleTitle = document.getElementById('article-title');
        const articleContent = document.getElementById('article-content');
        const articleMeta = document.getElementById('article-meta');
        const backButton = document.getElementById('back-button');
        const homeButton = document.getElementById('home-button');
        const homeButtonDetail = document.getElementById('home-button-detail');
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const searchOptionsButton = document.getElementById('search-options-button');
        const searchOptions = document.getElementById('search-options');
        const searchInfo = document.getElementById('search-info');
        const searchScopeText = document.getElementById('search-scope-text');
        const searchResultsCount = document.getElementById('search-results-count');
        const pagination = document.getElementById('pagination');
        const articleListContainer = document.getElementById('article-list-container');
        const categoryStats = document.getElementById('category-stats');
        const prevArticleButton = document.getElementById('prev-article-button');
        const nextArticleButton = document.getElementById('next-article-button');
        const categoryNav = document.getElementById('category-nav').querySelector('div');
        const loadingIndicator = document.getElementById('loading-indicator');
        const errorContainer = document.getElementById('error-container');
        const errorMessage = document.getElementById('error-message');

        // 配置参数
        const categories = [
            { id: 'category1', name: '诗词歌赋' },
            { id: 'category2', name: '历史典故' },
            { id: 'category3', name: '科技前沿' },
            { id: 'category4', name: '生活常识' },
            { id: 'category5', name: '艺术鉴赏' },
            { id: 'category6', name: '健康养生' },
            { id: 'category7', name: '体育赛事' }
        ];
        const itemsPerPage = 10;
        const LOAD_TIMEOUT = 8000; // 加载超时时间(ms)

        // 状态管理
        let currentPage = 1;
        let currentCategory = null;
        let searchTerm = '';
        let searchType = 'title'; // 默认为标题搜索，可选值: title, content, both
        let totalArticles = 0;
        let totalPages = 0;
        let categoryArticleCounts = {};
        let articleCache = new Map(); // 缓存已加载的文章内容
        let allArticles = []; // 存储所有已加载的文章，用于全文搜索
        let loadTimeout = null;

        // 初始化
        function init() {
            // 立即显示分类导航，不等待数据加载
            generateCategoryNav();
            // 显示加载状态
            showLoading();
            
            // 设置加载超时
            loadTimeout = setTimeout(() => {
                hideLoading();
                showError('加载超时，请检查网络连接或重试');
            }, LOAD_TIMEOUT);
            
            // 加载数据
            Promise.all([
                loadAllArticlesData(),
                handleUrlParams()
            ]).catch(error => {
                // 忽略解构错误
                if (!error.message.includes('Invalid attempt to destructure non-iterable instance')) {
                    console.error('初始化失败:', error);
                    hideLoading();
                    showError('加载失败: ' + (error.message || '未知错误'));
                } else {
                    hideLoading();
                }
            });

            // 返回首页按钮事件
            homeButton.addEventListener('click', goToHomePage);
            homeButtonDetail.addEventListener('click', goToHomePage);
        }

        // 返回首页功能
        function goToHomePage(e) {
            e.preventDefault();
            // 重置所有状态
            currentCategory = null;
            currentPage = 1;
            searchTerm = '';
            searchType = 'title';
            
            // 更新UI
            searchInput.value = '';
            document.querySelector(`input[name="search-type"][value="title"]`).checked = true;
            updateSearchOptionsUI();
            searchInfo.classList.add('hidden');
            
            // 显示列表，隐藏详情
            articleDetail.classList.add('hidden');
            articleListContainer.classList.remove('hidden');
            
            // 更新导航状态
            updateNavActiveState(null);
            
            // 重新加载首页内容
            showLoading();
            filterAndDisplayArticles().finally(() => hideLoading());
            
            // 更新URL为首页
            window.history.pushState({}, '', 'index.html');
        }

        // 预加载所有文章数据，用于全文搜索
        async function loadAllArticlesData() {
            allArticles = [];
            // 限制同时加载的分类数量，避免请求过多
            const batchSize = 2;
            
            for (let i = 0; i < categories.length; i += batchSize) {
                const batch = categories.slice(i, i + batchSize);
                const promises = batch.map(category => 
                    loadArticlesFromCategory(category.id, 1, 100) // 加载每个分类的前100篇文章
                );
                const results = await Promise.all(promises);
                results.forEach(articles => allArticles.push(...articles));
            }
            
            // 更新分类统计
            updateCategoryCounts();
            return true;
        }

        // 更新分类统计数量
        function updateCategoryCounts() {
            // 初始化统计
            const stats = {};
            categories.forEach(category => {
                stats[category.id] = 0;
            });
            
            // 统计各分类文章数量
            allArticles.forEach(article => {
                if (stats.hasOwnProperty(article.category)) {
                    stats[article.category]++;
                }
            });
            
            categoryArticleCounts = stats;
            displayCategoryStats();
            
            // 更新导航栏中的数量标记
            categories.forEach(category => {
                const count = stats[category.id];
                const badge = document.querySelector(`span[data-category="${category.id}"]`);
                if (badge) {
                    badge.textContent = `(${count})`;
                }
            });
            
            // 更新总数量
            const totalCount = Object.values(stats).reduce((sum, count) => sum + count, 0);
            document.getElementById('total-count-badge').textContent = `(${totalCount})`;
        }

        // 处理URL参数
        async function handleUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const category = urlParams.get('category');
            const articleId = urlParams.get('id');
            const page = parseInt(urlParams.get('p')) || 1;
            const q = urlParams.get('q') || '';
            const searchTypeParam = urlParams.get('searchType') || 'title';

            searchInput.value = q;
            searchTerm = q;
            currentPage = page;
            
            // 设置搜索类型
            if (['title', 'content', 'both'].includes(searchTypeParam)) {
                searchType = searchTypeParam;
                document.querySelector(`input[name="search-type"][value="${searchType}"]`).checked = true;
                updateSearchOptionsUI();
            }
            
            try {
                if (articleId && category) {
                    // 显示指定文章
                    await showArticleDetail(category, articleId);
                } else if (category && categories.some(c => c.id === category)) {
                    // 显示指定分类
                    currentCategory = category;
                    await filterAndDisplayArticles();
                    updateNavActiveState(category);
                } else {
                    // 显示所有文章
                    await filterAndDisplayArticles();
                }
                
                // 如果有搜索词，显示搜索信息
                if (searchTerm) {
                    updateSearchInfo();
                }
            } catch (error) {
                // 忽略解构错误
                if (!error.message.includes('Invalid attempt to destructure non-iterable instance')) {
                    console.error('处理URL参数失败:', error);
                    showError('加载失败: ' + (error.message || '未知错误'));
                }
            } finally {
                clearTimeout(loadTimeout);
                hideLoading();
            }
        }

        // 显示分类统计
        function displayCategoryStats() {
            let totalCount = 0;
            let statsHtml = '<div class="flex flex-wrap gap-x-6 gap-y-2">';
            statsHtml += '<span class="font-medium">文章分类统计：</span>';
            
            for (const category of categories) {
                const count = categoryArticleCounts[category.id] || 0;
                totalCount += count;
                statsHtml += `<div><span class="text-gray-700">${category.name}:</span> <span class="font-medium">${count}</span> 篇</div>`;
            }
            
            statsHtml += `<div class="w-full mt-2 pt-2 border-t border-gray-100"><span class="font-medium">总计:</span> ${totalCount} 篇文章</div>`;
            statsHtml += '</div>';
            
            categoryStats.innerHTML = statsHtml;
        }

        // 生成分类导航 - 立即执行，不依赖数据加载
        function generateCategoryNav() {
            // 添加"全部文章"链接
            const allLink = document.createElement('a');
            allLink.href = '?p=1';
            allLink.className = 'nav-link text-blue-500 hover:text-blue-700 whitespace-nowrap';
            allLink.innerHTML = `全部文章 <span class="ml-1 text-xs bg-gray-200 px-1 rounded" id="total-count-badge">(0)</span>`;
            if (!currentCategory) {
                allLink.classList.add('active');
            }
            allLink.addEventListener('click', (e) => {
                e.preventDefault();
                currentCategory = null;
                currentPage = 1;
                showLoading();
                filterAndDisplayArticles().finally(() => hideLoading());
                updateNavActiveState(null);
            });
            categoryNav.appendChild(allLink);
            
            // 添加各分类链接
            categories.forEach(category => {
                const link = document.createElement('a');
                link.href = `?category=${category.id}&p=1`;
                link.className = 'nav-link text-blue-500 hover:text-blue-700 whitespace-nowrap';
                link.innerHTML = `${category.name} <span class="ml-1 text-xs bg-gray-200 px-1 rounded" data-category="${category.id}">(0)</span>`;
                if (currentCategory === category.id) {
                    link.classList.add('active');
                }
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentCategory = category.id;
                    currentPage = 1;
                    showLoading();
                    filterAndDisplayArticles().finally(() => hideLoading());
                    updateNavActiveState(category.id);
                });
                categoryNav.appendChild(link);
            });
        }

        // 更新导航激活状态
        function updateNavActiveState(activeCategory) {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });
            
            if (activeCategory === null) {
                // 激活"全部文章"
                categoryNav.querySelector('a:first-child').classList.add('active');
            } else {
                // 激活对应分类
                document.querySelectorAll('.nav-link').forEach(link => {
                    if (link.href.includes(`category=${activeCategory}`)) {
                        link.classList.add('active');
                    }
                });
            }
        }

        // 过滤并显示文章
        async function filterAndDisplayArticles() {
            try {
                // 应用分类过滤
                let filteredArticles = allArticles;
                if (currentCategory) {
                    filteredArticles = allArticles.filter(article => article.category === currentCategory);
                }
                
                // 应用搜索过滤（支持标题、内容或两者）
                if (searchTerm) {
                    const term = searchTerm.toLowerCase();
                    filteredArticles = filteredArticles.filter(article => {
                        const titleMatch = article.title.toLowerCase().includes(term);
                        const contentMatch = article.content.toLowerCase().includes(term);
                        
                        switch (searchType) {
                            case 'title':
                                return titleMatch;
                            case 'content':
                                return contentMatch;
                            case 'both':
                                return titleMatch || contentMatch;
                            default:
                                return titleMatch;
                        }
                    });
                }
                
                // 排序
                filteredArticles.sort((a, b) => {
                    if (a.category === b.category) {
                        return a.id - b.id;
                    }
                    return a.category.localeCompare(b.category);
                });
                
                // 分页处理
                totalArticles = filteredArticles.length;
                totalPages = Math.ceil(totalArticles / itemsPerPage);
                const startIndex = (currentPage - 1) * itemsPerPage;
                const pageArticles = filteredArticles.slice(startIndex, startIndex + itemsPerPage);
                
                displayArticles(pageArticles);
                displayPagination();
                updateUrl();
                updateSearchInfo();
            } catch (error) {
                // 忽略解构错误
                if (!error.message.includes('Invalid attempt to destructure non-iterable instance')) {
                    console.error('过滤文章失败:', error);
                    showError('加载文章失败: ' + error.message);
                }
            }
        }

        // 从指定分类加载文章
        async function loadArticlesFromCategory(category, startId, endId) {
            const articles = [];
            const cacheKeyPrefix = `${category}_`;
            
            // 先检查缓存
            for (let id = startId; id <= endId; id++) {
                const cacheKey = cacheKeyPrefix + id;
                if (articleCache.has(cacheKey)) {
                    articles.push(articleCache.get(cacheKey));
                }
            }
            
            // 如果缓存中已有足够的文章，直接返回
            if (articles.length >= endId - startId + 1) {
                return articles;
            }
            
            // 逐个加载文章，避免请求过多
            for (let id = startId; id <= endId; id++) {
                const cacheKey = cacheKeyPrefix + id;
                if (articleCache.has(cacheKey)) {
                    continue; // 已缓存，跳过
                }
                
                try {
                    // 设置单篇文章加载超时
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 3000);
                    
                    const response = await fetch(`${category}/${id}.txt`, { 
                        signal: controller.signal 
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (!response.ok) {
                        continue; // 文件不存在，继续下一个
                    }
                    
                    const arrayBuffer = await response.arrayBuffer();
                    const encoding = detectEncoding(arrayBuffer);
                    let text = '';
                    
                    if (encoding === 'utf-8') {
                        const decoder = new TextDecoder('utf-8');
                        text = decoder.decode(arrayBuffer);
                    } else {
                        const decoder = new TextDecoder('gbk');
                        text = decoder.decode(arrayBuffer);
                    }
                    
                    const lines = text.split('\n');
                    const title = lines[0] || `未命名文章 (${category}-${id})`;
                    const content = lines.slice(1).join('\n');
                    
                    // 判断是否为Markdown文件
                    const isMarkdown = title.toLowerCase().endsWith('.md') || 
                                      (id.toString().includes('.md'));
                    
                    const article = {
                        id,
                        title: title.replace(/\.md$/i, ''),
                        content,
                        category,
                        path: `${category}/${id}.txt`,
                        isMarkdown
                    };
                    
                    articles.push(article);
                    articleCache.set(cacheKey, article); // 缓存文章
                } catch (error) {
                    // 忽略解构错误和超时错误
                    if (error.name !== 'AbortError' && 
                        !error.message.includes('Invalid attempt to destructure non-iterable instance')) {
                        console.error(`加载文章 ${category}/${id}.txt 失败:`, error);
                    }
                    // 单篇文章加载失败不影响整体，继续加载下一篇
                    continue;
                }
            }
            
            return articles;
        }

        // 显示文章列表
        function displayArticles(articles) {
            articleList.innerHTML = '';
            
            if (articles.length === 0) {
                const noResultsItem = document.createElement('div');
                noResultsItem.className = 'col-span-full text-center py-10 text-gray-500';
                noResultsItem.innerHTML = '<i class="fas fa-search-minus text-3xl mb-2"></i><p>未找到相关文章</p>';
                articleList.appendChild(noResultsItem);
                return;
            }
            
            articles.forEach(article => {
                const categoryInfo = categories.find(c => c.id === article.category);
                const categoryName = categoryInfo ? categoryInfo.name : article.category;
                
                // 处理搜索高亮
                let displayTitle = article.title;
                if (searchTerm && searchType !== 'content') {
                    const term = searchTerm.toLowerCase();
                    const regex = new RegExp(`(${term})`, 'gi');
                    displayTitle = displayTitle.replace(regex, '<span class="search-hit">$1</span>');
                }
                
                const articleItem = document.createElement('div');
                articleItem.className = 'bg-white p-4 rounded-lg shadow-sm hover:shadow-md transition';
                
                const link = document.createElement('a');
                link.href = `?category=${article.category}&id=${article.id}`;
                link.className = 'block h-full';
                link.innerHTML = `
                    <div class="flex justify-between items-start">
                        <h3 class="font-medium text-gray-800 hover:text-blue-600 line-clamp-2">${displayTitle}</h3>
                        <span class="text-xs px-2 py-1 bg-gray-100 text-gray-600 rounded-full">${categoryName}</span>
                    </div>
                    <p class="text-gray-500 text-sm mt-2">ID: ${article.id}</p>
                `;
                
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    showArticleDetail(article.category, article.id);
                });
                
                articleItem.appendChild(link);
                articleList.appendChild(articleItem);
            });
        }

        // 显示文章详情
        async function showArticleDetail(category, id) {
            showLoading();
            try {
                const cacheKey = `${category}_${id}`;
                let article;
                
                // 检查缓存
                if (articleCache.has(cacheKey)) {
                    article = articleCache.get(cacheKey);
                } else {
                    // 加载单篇文章
                    const articles = await loadArticlesFromCategory(category, parseInt(id), parseInt(id));
                    article = articles[0];
                    
                    if (!article) {
                        throw new Error('文章不存在或无法加载');
                    }
                }
                
                // 显示文章详情
                articleListContainer.classList.add('hidden');
                articleDetail.classList.remove('hidden');
                
                // 处理标题搜索高亮
                let displayTitle = article.title;
                if (searchTerm && searchType !== 'content') {
                    const term = searchTerm.toLowerCase();
                    const regex = new RegExp(`(${term})`, 'gi');
                    displayTitle = displayTitle.replace(regex, '<span class="search-hit">$1</span>');
                }
                
                articleTitle.innerHTML = displayTitle;
                
                const categoryInfo = categories.find(c => c.id === article.category);
                articleMeta.innerHTML = `
                    <span class="mr-4"><i class="fas fa-folder text-gray-400 mr-1"></i> ${categoryInfo ? categoryInfo.name : article.category}</span>
                    <span><i class="fas fa-file-alt text-gray-400 mr-1"></i> ID: ${article.id}</span>
                    ${article.isMarkdown ? '<span class="ml-4 px-2 py-0.5 bg-blue-100 text-blue-700 text-xs rounded">Markdown</span>' : ''}
                `;
                
                // 处理内容搜索高亮
                let displayContent = article.content;
                if (searchTerm && searchType !== 'title') {
                    const term = searchTerm.toLowerCase();
                    const regex = new RegExp(`(${term})`, 'gi');
                    displayContent = displayContent.replace(regex, '<span class="search-hit">$1</span>');
                }
                
                // 根据是否为Markdown决定如何显示内容
                if (article.isMarkdown) {
                    articleContent.innerHTML = marked.parse(displayContent);
                } else {
                    articleContent.innerHTML = `<pre>${displayContent}</pre>`;
                }
                
                // 更新导航按钮状态
                await updateNavigationButtons(category, id);
                
                // 更新URL
                window.history.pushState({}, '', `?category=${category}&id=${id}`);
            } catch (error) {
                // 忽略解构错误
                if (!error.message.includes('Invalid attempt to destructure non-iterable instance')) {
                    console.error('显示文章详情失败:', error);
                    showError('无法加载文章内容: ' + error.message);
                }
            } finally {
                hideLoading();
            }
        }

        // 更新导航按钮状态
        async function updateNavigationButtons(category, currentId) {
            const id = parseInt(currentId);
            
            // 获取当前分类的所有文章ID
            const sameCategoryArticles = allArticles
                .filter(article => article.category === category)
                .map(article => article.id)
                .sort((a, b) => a - b);
                
            const currentIndex = sameCategoryArticles.indexOf(id);
            const totalArticles = sameCategoryArticles.length;
            
            // 检查上一篇是否存在
            let hasPrev = currentIndex > 0;
            // 检查下一篇是否存在
            let hasNext = currentIndex < totalArticles - 1;
            
            // 更新按钮状态
            prevArticleButton.disabled = !hasPrev;
            prevArticleButton.classList.toggle('opacity-50', !hasPrev);
            prevArticleButton.classList.toggle('cursor-not-allowed', !hasPrev);
            
            nextArticleButton.disabled = !hasNext;
            nextArticleButton.classList.toggle('opacity-50', !hasNext);
            nextArticleButton.classList.toggle('cursor-not-allowed', !hasNext);
            
            // 添加按钮点击事件
            prevArticleButton.onclick = hasPrev ? () => {
                showLoading();
                showArticleDetail(category, sameCategoryArticles[currentIndex - 1]).finally(() => hideLoading());
            } : null;
            
            nextArticleButton.onclick = hasNext ? () => {
                showLoading();
                showArticleDetail(category, sameCategoryArticles[currentIndex + 1]).finally(() => hideLoading());
            } : null;
        }

        // 显示分页控件
        function displayPagination() {
            pagination.innerHTML = '';
            
            if (totalPages <= 1) {
                pagination.classList.add('hidden');
                return;
            }
            
            pagination.classList.remove('hidden');
            
            // 首页按钮
            const firstButton = createPageButton('首页', 1);
            firstButton.disabled = currentPage === 1;
            pagination.appendChild(firstButton);
            
            // 上一页按钮
            const prevButton = createPageButton('<i class="fas fa-chevron-left"></i>', currentPage - 1);
            prevButton.disabled = currentPage === 1;
            pagination.appendChild(prevButton);
            
            // 页码按钮 - 只显示当前页附近的页码
            const visiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(visiblePages / 2));
            let endPage = startPage + visiblePages - 1;
            
            if (endPage > totalPages) {
                endPage = totalPages;
                startPage = Math.max(1, endPage - visiblePages + 1);
            }
            
            for (let i = startPage; i <= endPage; i++) {
                const pageButton = createPageButton(i, i);
                if (i === currentPage) {
                    pageButton.classList.add('bg-blue-700');
                    pageButton.disabled = true;
                }
                pagination.appendChild(pageButton);
            }
            
            // 下一页按钮
            const nextButton = createPageButton('<i class="fas fa-chevron-right"></i>', currentPage + 1);
            nextButton.disabled = currentPage === totalPages;
            pagination.appendChild(nextButton);
            
            // 末页按钮
            const lastButton = createPageButton('末页', totalPages);
            lastButton.disabled = currentPage === totalPages;
            pagination.appendChild(lastButton);
        }

        // 创建分页按钮
        function createPageButton(text, pageNumber) {
            const button = document.createElement('button');
            button.innerHTML = text;
            button.className = 'pagination-link bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition';
            button.setAttribute('data-page', pageNumber);
            button.addEventListener('click', () => {
                currentPage = pageNumber;
                showLoading();
                filterAndDisplayArticles().finally(() => hideLoading());
            });
            return button;
        }

        // 执行搜索
        function performSearch() {
            const term = searchInput.value.trim();
            if (term !== searchTerm) {
                searchTerm = term;
                currentPage = 1; // 搜索时重置到第一页
                showLoading();
                filterAndDisplayArticles().finally(() => hideLoading());
            }
        }

        // 更新搜索选项UI
        function updateSearchOptionsUI() {
            // 更新活动状态
            document.querySelectorAll('.search-option').forEach(option => {
                option.classList.remove('active');
            });
            document.querySelector(`.search-option[data-option="${searchType}"]`).classList.add('active');
            
            // 更新搜索范围文本
            const scopeTextMap = {
                'title': '标题',
                'content': '内容',
                'both': '标题和内容'
            };
            searchScopeText.textContent = scopeTextMap[searchType] || '标题';
        }

        // 更新搜索信息
        function updateSearchInfo() {
            if (searchTerm) {
                searchInfo.classList.remove('hidden');
                searchResultsCount.textContent = `找到 ${totalArticles} 篇相关文章`;
            } else {
                searchInfo.classList.add('hidden');
            }
        }

        // 更新URL
        function updateUrl() {
            const urlParams = new URLSearchParams();
            
            if (currentCategory) {
                urlParams.set('category', currentCategory);
            }
            
            if (searchTerm) {
                urlParams.set('q', searchTerm);
                urlParams.set('searchType', searchType);
            }
            
            urlParams.set('p', currentPage);
            
            window.history.replaceState({}, '', `?${urlParams.toString()}`);
        }

        // 编码检测函数
        function detectEncoding(arrayBuffer) {
            const uint8Array = new Uint8Array(arrayBuffer);
            
            // 简单判断是否为UTF-8编码
            for (let i = 0; i < Math.min(100, uint8Array.length); i++) { // 只检查前100个字节
                if ((uint8Array[i] & 0x80) === 0) {
                    continue; // 单字节字符
                } else if ((uint8Array[i] & 0xE0) === 0xC0) {
                    // 双字节序列
                    if (i + 1 >= uint8Array.length) return 'gbk';
                    if ((uint8Array[i + 1] & 0xC0) !== 0x80) return 'gbk';
                    i++;
                } else if ((uint8Array[i] & 0xF0) === 0xE0) {
                    // 三字节序列
                    if (i + 2 >= uint8Array.length) return 'gbk';
                    if ((uint8Array[i + 1] & 0xC0) !== 0x80 || (uint8Array[i + 2] & 0xC0) !== 0x80) return 'gbk';
                    i += 2;
                } else {
                    // 不符合UTF-8编码规则，视为GBK
                    return 'gbk';
                }
            }
            
            return 'utf-8';
        }

        // 事件监听
        backButton.addEventListener('click', () => {
            articleDetail.classList.add('hidden');
            articleListContainer.classList.remove('hidden');
            updateUrl();
        });

        searchButton.addEventListener('click', performSearch);

        searchInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                performSearch();
            }
        });

        // 搜索选项切换
        searchOptionsButton.addEventListener('click', (e) => {
            e.stopPropagation();
            searchOptions.classList.toggle('hidden');
        });

        // 点击其他区域关闭搜索选项
        document.addEventListener('click', () => {
            searchOptions.classList.add('hidden');
        });

        // 阻止搜索选项内部点击冒泡
        searchOptions.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // 搜索选项点击事件
        document.querySelectorAll('.search-option').forEach(option => {
            option.addEventListener('click', () => {
                const type = option.getAttribute('data-option');
                if (type && ['title', 'content', 'both'].includes(type)) {
                    searchType = type;
                    document.querySelector(`input[name="search-type"][value="${type}"]`).checked = true;
                    updateSearchOptionsUI();
                    
                    // 如果有搜索词，重新搜索
                    if (searchTerm) {
                        currentPage = 1;
                        showLoading();
                        filterAndDisplayArticles().finally(() => hideLoading());
                    }
                }
            });
        });

        // 监听浏览器历史记录变化
        window.addEventListener('popstate', () => {
            showLoading();
            handleUrlParams().finally(() => hideLoading());
        });

        // 初始化系统
        init();
    </script>
</body>
