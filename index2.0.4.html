<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="鲁虺文本内容搜索展示系统，自动统计并展示各类文章">
    <meta name="keywords" content="文章系统,文本展示,自动统计,分类浏览">
    <title>鲁虺文本内容搜索展示系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Consolas', 'Monaco', monospace;
            background-color: #f5f5f5;
            padding: 1rem;
            border-radius: 4px;
            margin: 1rem 0;
        }
        .markdown-content h1, .markdown-content h2, .markdown-content h3 {
            font-weight: bold;
            margin: 1.5rem 0 1rem;
        }
        .markdown-content h1 { font-size: 1.8rem; }
        .markdown-content h2 { font-size: 1.5rem; }
        .markdown-content h3 { font-size: 1.2rem; }
        .markdown-content p { margin-bottom: 1rem; }
        .markdown-content ul, .markdown-content ol { 
            margin-left: 1.5rem; 
            margin-bottom: 1rem;
        }
        .markdown-content ul { list-style-type: disc; }
        .markdown-content ol { list-style-type: decimal; }
        .markdown-content blockquote {
            border-left: 4px solid #ddd;
            padding-left: 1rem;
            margin: 1rem 0;
            color: #666;
        }
        .markdown-content a { color: #3b82f6; text-decoration: underline; }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            border-top-color: #3b82f6;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .nav-link.active {
            color: #1e40af;
            font-weight: bold;
            text-decoration: underline;
        }
        .error-message {
            background-color: #fee2e2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 1rem;
            border-radius: 4px;
            margin: 1rem 0;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto p-4 md:p-8 max-w-6xl">
        <header class="mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">鲁虺文本内容搜索展示系统</h1>
            <p class="text-gray-600">高效检索与展示各类文本内容</p>
        </header>
        
        <div class="mb-6">
            <form id="search-form" class="flex flex-col md:flex-row gap-3">
                <input type="text" id="search-input" placeholder="搜索文章标题..."
                    class="border border-gray-300 p-2 rounded-md flex-grow focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="hidden" id="current-category" value="">
                <button type="submit" class="bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition">
                    <i class="fas fa-search mr-1"></i> 搜索
                </button>
            </form>
        </div>
        
        <!-- 分类导航 -->
        <div id="category-nav" class="mb-6 overflow-x-auto pb-2">
            <div class="flex space-x-4 min-w-max">
                <a href="#" data-category="" class="nav-link text-blue-500 hover:text-blue-700 whitespace-nowrap active">
                    全部文章
                    <span class="ml-1 text-xs bg-gray-200 px-1 rounded" id="total-count-badge">(0)</span>
                </a>
            </div>
        </div>
        
        <!-- 分类统计 -->
        <div id="category-stats" class="mb-6 p-4 bg-white rounded-lg shadow-sm">
            <div class="flex flex-wrap gap-x-6 gap-y-2">
                <span class="font-medium">文章分类统计：</span>
                <!-- 统计内容将通过JS动态生成 -->
            </div>
        </div>
        
        <!-- 文章详情页容器 -->
        <div id="article-detail" class="hidden">
            <a href="#" id="back-to-list" class="mb-6 inline-flex items-center bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition">
                <i class="fas fa-arrow-left mr-2"></i> 返回列表
            </a>
            
            <div class="bg-white p-6 rounded-lg shadow-sm mb-6">
                <h2 class="text-2xl md:text-3xl font-bold mb-4 text-gray-800" id="article-title"></h2>
                <div class="text-gray-500 text-sm mb-6">
                    <span class="mr-4"><i class="fas fa-folder text-gray-400 mr-1"></i> <span id="article-category"></span></span>
                    <span><i class="fas fa-file-alt text-gray-400 mr-1"></i> ID: <span id="article-id"></span></span>
                    <span id="markdown-badge" class="ml-4 px-2 py-0.5 bg-blue-100 text-blue-700 text-xs rounded hidden">Markdown</span>
                </div>
                <div class="markdown-content text-gray-700 leading-relaxed" id="article-content">
                </div>
            </div>
            
            <div class="flex justify-between">
                <a href="#" id="prev-article" class="bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition opacity-50 cursor-not-allowed"
                   onclick="return false;">
                    <i class="fas fa-chevron-left mr-1"></i> 上一篇
                </a>
                
                <a href="#" id="next-article" class="bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition opacity-50 cursor-not-allowed"
                   onclick="return false;">
                    下一篇 <i class="fas fa-chevron-right ml-1"></i>
                </a>
            </div>
        </div>
        
        <!-- 文章列表容器 -->
        <div id="article-list-container">
            <div id="article-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 文章列表将通过JS动态生成 -->
                <div class="col-span-full text-center py-10 text-gray-500">
                    <i class="fas fa-search-minus text-3xl mb-2"></i>
                    <p>加载文章列表中...</p>
                </div>
            </div>
            
            <!-- 分页控件 -->
            <div id="pagination" class="flex flex-wrap justify-center gap-2 mt-6 hidden">
                <a href="#" data-page="1" class="pagination-link bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition">
                    首页
                </a>
                
                <a href="#" id="prev-page" class="pagination-link bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition opacity-50 cursor-not-allowed"
                   onclick="return false;">
                    <i class="fas fa-chevron-left"></i>
                </a>
                
                <!-- 页码将通过JS动态生成 -->
                
                <a href="#" id="next-page" class="pagination-link bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition opacity-50 cursor-not-allowed"
                   onclick="return false;">
                    <i class="fas fa-chevron-right"></i>
                </a>
                
                <a href="#" id="last-page" data-page="1" class="pagination-link bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition">
                    末页
                </a>
            </div>
        </div>
    </div>

    <script>
        // 系统配置
        const categories = [
            { id: 'category1', name: '诗词歌赋' },
            { id: 'category2', name: '历史典故' },
            { id: 'category3', name: '科技前沿' },
            { id: 'category4', name: '生活常识' },
            { id: 'category5', name: '艺术鉴赏' },
            { id: 'category6', name: '健康养生' },
            { id: 'category7', name: '体育赛事' }
        ];
        
        const itemsPerPage = 10;
        let currentCategory = '';
        let currentPage = 1;
        let searchTerm = '';
        let allArticles = []; // 存储所有文章数据
        let categoryStats = {}; // 存储分类统计数据
        
        // 关键词库
        const keywordsPool = [
            '文学', '历史', '科技', '健康', '生活', '艺术', '体育',
            '诗歌', '典故', '前沿', '常识', '鉴赏', '养生', '赛事',
            '文化', '知识', '科学', '保健', '技巧', '美学', '运动'
        ];

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 生成模拟文章数据
            generateMockArticles();
            
            // 初始化页面
            initCategoryNav();
            updateCategoryStats();
            renderArticleList();
            
            // 事件监听
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const category = this.getAttribute('data-category');
                    currentCategory = category;
                    currentPage = 1;
                    searchTerm = '';
                    document.getElementById('search-input').value = '';
                    document.getElementById('current-category').value = category;
                    updateActiveNavLink();
                    renderArticleList();
                });
            });
            
            document.getElementById('search-form').addEventListener('submit', function(e) {
                e.preventDefault();
                searchTerm = document.getElementById('search-input').value.trim();
                currentPage = 1;
                renderArticleList();
            });
            
            document.getElementById('back-to-list').addEventListener('click', function(e) {
                e.preventDefault();
                document.getElementById('article-detail').classList.add('hidden');
                document.getElementById('article-list-container').classList.remove('hidden');
            });
            
            // 分页事件委托
            document.getElementById('pagination').addEventListener('click', function(e) {
                e.preventDefault();
                const target = e.target.closest('.pagination-link');
                if (!target) return;
                
                const page = parseInt(target.getAttribute('data-page'));
                if (!isNaN(page)) {
                    currentPage = page;
                    renderArticleList();
                }
            });
            
            // 上一篇/下一篇文章导航
            document.getElementById('prev-article').addEventListener('click', function(e) {
                e.preventDefault();
                const articleId = parseInt(this.getAttribute('data-id'));
                if (!isNaN(articleId)) {
                    showArticleDetail(currentCategory, articleId);
                }
            });
            
            document.getElementById('next-article').addEventListener('click', function(e) {
                e.preventDefault();
                const articleId = parseInt(this.getAttribute('data-id'));
                if (!isNaN(articleId)) {
                    showArticleDetail(currentCategory, articleId);
                }
            });
        });
        
        // 生成模拟文章数据（实际应用中可替换为API调用）
        function generateMockArticles() {
            allArticles = [];
            
            // 为每个分类生成随机数量的文章
            categories.forEach(category => {
                // 随机生成1-20篇文章
                const articleCount = Math.floor(Math.random() * 20) + 1;
                
                for (let i = 1; i <= articleCount; i++) {
                    // 随机决定是否为Markdown
                    const isMarkdown = Math.random() > 0.7;
                    
                    // 生成模拟内容
                    let content = '';
                    if (isMarkdown) {
                        content = `# 这是一篇${category.name}的Markdown文章\n\n这是文章的正文部分。\n\n- 列表项1\n- 列表项2\n\n**粗体文本** 和 *斜体文本*`;
                    } else {
                        content = `这是一篇${category.name}的普通文本文章。\n\n这是文章的正文内容，包含多行文本。\n第三行文本...`;
                    }
                    
                    allArticles.push({
                        id: i,
                        category: category.id,
                        title: `${category.name} 第${i}篇${isMarkdown ? ' (MD)' : ''}`,
                        description: `${category.name}文章的简要描述，这是第${i}篇`,
                        content: content,
                        isMarkdown: isMarkdown
                    });
                }
            });
        }
        
        // 初始化分类导航
        function initCategoryNav() {
            const navContainer = document.querySelector('#category-nav .flex');
            
            // 为每个分类添加导航链接
            categories.forEach(category => {
                const link = document.createElement('a');
                link.href = '#';
                link.className = 'nav-link text-blue-500 hover:text-blue-700 whitespace-nowrap';
                link.setAttribute('data-category', category.id);
                link.innerHTML = `${category.name} <span class="ml-1 text-xs bg-gray-200 px-1 rounded" data-category="${category.id}">(0)</span>`;
                navContainer.appendChild(link);
            });
        }
        
        // 更新分类统计
        function updateCategoryStats() {
            // 初始化统计
            const stats = {};
            categories.forEach(category => {
                stats[category.id] = 0;
            });
            
            // 统计各分类文章数量
            allArticles.forEach(article => {
                if (stats.hasOwnProperty(article.category)) {
                    stats[article.category]++;
                }
            });
            
            categoryStats = stats;
            
            // 更新导航栏中的数量标记
            categories.forEach(category => {
                const count = stats[category.id];
                const badge = document.querySelector(`span[data-category="${category.id}"]`);
                if (badge) {
                    badge.textContent = `(${count})`;
                }
            });
            
            // 更新总数量
            const totalCount = Object.values(stats).reduce((sum, count) => sum + count, 0);
            document.getElementById('total-count-badge').textContent = `(${totalCount})`;
            
            // 更新统计区域
            const statsContainer = document.querySelector('#category-stats .flex');
            // 保留标题，清除其他统计项
            while (statsContainer.children.length > 1) {
                statsContainer.removeChild(statsContainer.lastChild);
            }
            
            // 添加各分类统计
            let total = 0;
            categories.forEach(category => {
                const count = stats[category.id];
                total += count;
                
                const statItem = document.createElement('div');
                statItem.innerHTML = `<span class="text-gray-700">${category.name}:</span> <span class="font-medium">${count}</span> 篇`;
                statsContainer.appendChild(statItem);
            });
            
            // 添加总计
            const totalItem = document.createElement('div');
            totalItem.className = 'w-full mt-2 pt-2 border-t border-gray-100';
            totalItem.innerHTML = `<span class="font-medium">总计:</span> ${total} 篇文章`;
            statsContainer.appendChild(totalItem);
        }
        
        // 更新激活的导航链接
        function updateActiveNavLink() {
            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.getAttribute('data-category') === currentCategory) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }
        
        // 过滤文章
        function filterArticles() {
            let filtered = [...allArticles];
            
            // 按分类过滤
            if (currentCategory) {
                filtered = filtered.filter(article => article.category === currentCategory);
            }
            
            // 按搜索词过滤
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = filtered.filter(article => 
                    article.title.toLowerCase().includes(term)
                );
            }
            
            return filtered;
        }
        
        // 渲染文章列表
        function renderArticleList() {
            const articles = filterArticles();
            const articleListContainer = document.getElementById('article-list');
            const paginationContainer = document.getElementById('pagination');
            
            // 清空列表
            articleListContainer.innerHTML = '';
            
            // 分页处理
            const totalPages = Math.max(1, Math.ceil(articles.length / itemsPerPage));
            const startIndex = (currentPage - 1) * itemsPerPage;
            const paginatedArticles = articles.slice(startIndex, startIndex + itemsPerPage);
            
            // 显示文章列表
            if (paginatedArticles.length > 0) {
                paginatedArticles.forEach(article => {
                    const categoryInfo = categories.find(c => c.id === article.category);
                    const categoryName = categoryInfo ? categoryInfo.name : article.category;
                    
                    const articleElement = document.createElement('div');
                    articleElement.className = 'bg-white p-4 rounded-lg shadow-sm hover:shadow-md transition';
                    articleElement.innerHTML = `
                        <a href="#" class="article-link block h-full" data-category="${article.category}" data-id="${article.id}">
                            <div class="flex justify-between items-start">
                                <h3 class="font-medium text-gray-800 hover:text-blue-600 line-clamp-2">
                                    ${article.title}
                                </h3>
                                <span class="text-xs px-2 py-1 bg-gray-100 text-gray-600 rounded-full">
                                    ${categoryName}
                                </span>
                            </div>
                            <p class="text-gray-500 text-sm mt-2">ID: ${article.id}</p>
                        </a>
                    `;
                    articleListContainer.appendChild(articleElement);
                });
                
                // 添加文章点击事件
                document.querySelectorAll('.article-link').forEach(link => {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        const category = this.getAttribute('data-category');
                        const id = parseInt(this.getAttribute('data-id'));
                        showArticleDetail(category, id);
                    });
                });
            } else {
                // 没有找到文章
                articleListContainer.innerHTML = `
                    <div class="col-span-full text-center py-10 text-gray-500">
                        <i class="fas fa-search-minus text-3xl mb-2"></i>
                        <p>未找到相关文章</p>
                    </div>
                `;
            }
            
            // 更新分页
            if (totalPages > 1) {
                paginationContainer.classList.remove('hidden');
                
                // 清除现有页码（保留首页、上一页、下一页、末页）
                const pageLinks = paginationContainer.querySelectorAll('.pagination-link:not(#prev-page):not(#next-page):not([data-page="1"]):not(#last-page)');
                pageLinks.forEach(link => link.remove());
                
                // 更新末页链接
                document.getElementById('last-page').setAttribute('data-page', totalPages);
                
                // 生成页码
                const visiblePages = 5;
                let startPage = Math.max(1, currentPage - Math.floor(visiblePages / 2));
                let endPage = Math.min(startPage + visiblePages - 1, totalPages);
                
                if (endPage - startPage < visiblePages - 1) {
                    startPage = Math.max(1, endPage - visiblePages + 1);
                }
                
                const prevPageLink = document.getElementById('prev-page');
                const nextPageLink = document.getElementById('next-page');
                
                // 更新上一页按钮状态
                if (currentPage > 1) {
                    prevPageLink.setAttribute('data-page', currentPage - 1);
                    prevPageLink.classList.remove('opacity-50', 'cursor-not-allowed');
                    prevPageLink.removeAttribute('onclick');
                } else {
                    prevPageLink.classList.add('opacity-50', 'cursor-not-allowed');
                    prevPageLink.setAttribute('onclick', 'return false;');
                }
                
                // 更新下一页按钮状态
                if (currentPage < totalPages) {
                    nextPageLink.setAttribute('data-page', currentPage + 1);
                    nextPageLink.classList.remove('opacity-50', 'cursor-not-allowed');
                    nextPageLink.removeAttribute('onclick');
                } else {
                    nextPageLink.classList.add('opacity-50', 'cursor-not-allowed');
                    nextPageLink.setAttribute('onclick', 'return false;');
                }
                
                // 添加页码链接
                const nextPageElement = document.getElementById('next-page');
                for (let i = startPage; i <= endPage; i++) {
                    const pageLink = document.createElement('a');
                    pageLink.href = '#';
                    pageLink.className = `pagination-link bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition ${i === currentPage ? 'bg-blue-700 pointer-events-none' : ''}`;
                    pageLink.setAttribute('data-page', i);
                    pageLink.textContent = i;
                    paginationContainer.insertBefore(pageLink, nextPageElement);
                }
            } else {
                paginationContainer.classList.add('hidden');
            }
        }
        
        // 显示文章详情
        function showArticleDetail(category, id) {
            // 查找文章
            const article = allArticles.find(a => a.category === category && a.id === id);
            if (!article) return;
            
            currentCategory = category;
            
            // 更新页面内容
            document.getElementById('article-title').textContent = article.title;
            document.getElementById('article-id').textContent = article.id;
            
            const categoryInfo = categories.find(c => c.id === article.category);
            document.getElementById('article-category').textContent = categoryInfo ? categoryInfo.name : article.category;
            
            // 处理Markdown标记
            if (article.isMarkdown) {
                document.getElementById('markdown-badge').classList.remove('hidden');
                document.getElementById('article-content').innerHTML = parseMarkdown(article.content);
            } else {
                document.getElementById('markdown-badge').classList.add('hidden');
                document.getElementById('article-content').innerHTML = `<pre>${escapeHtml(article.content)}</pre>`;
            }
            
            // 更新上一篇/下一篇导航
            const sameCategoryArticles = allArticles
                .filter(a => a.category === category)
                .sort((a, b) => a.id - b.id);
            
            const currentIndex = sameCategoryArticles.findIndex(a => a.id === id);
            
            // 上一篇
            const prevArticle = sameCategoryArticles[currentIndex - 1];
            const prevLink = document.getElementById('prev-article');
            if (prevArticle) {
                prevLink.setAttribute('data-id', prevArticle.id);
                prevLink.classList.remove('opacity-50', 'cursor-not-allowed');
                prevLink.removeAttribute('onclick');
            } else {
                prevLink.removeAttribute('data-id');
                prevLink.classList.add('opacity-50', 'cursor-not-allowed');
                prevLink.setAttribute('onclick', 'return false;');
            }
            
            // 下一篇
            const nextArticle = sameCategoryArticles[currentIndex + 1];
            const nextLink = document.getElementById('next-article');
            if (nextArticle) {
                nextLink.setAttribute('data-id', nextArticle.id);
                nextLink.classList.remove('opacity-50', 'cursor-not-allowed');
                nextLink.removeAttribute('onclick');
            } else {
                nextLink.removeAttribute('data-id');
                nextLink.classList.add('opacity-50', 'cursor-not-allowed');
                nextLink.setAttribute('onclick', 'return false;');
            }
            
            // 显示文章详情，隐藏列表
            document.getElementById('article-detail').classList.remove('hidden');
            document.getElementById('article-list-container').classList.add('hidden');
        }
        
        // Markdown解析（简化版）
        function parseMarkdown(content) {
            // 标题
            content = content.replace(/^# (.*)$/gm, '<h1>$1</h1>');
            content = content.replace(/^## (.*)$/gm, '<h2>$1</h2>');
            content = content.replace(/^### (.*)$/gm, '<h3>$1</h3>');
            
            // 粗体和斜体
            content = content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            content = content.replace(/\*(.*?)\*/g, '<em>$1</em>');
            
            // 列表
            content = content.replace(/^- (.*)$/gm, '<li>$1</li>');
            content = content.replace(/(<li>.*?<\/li>)\s+/gs, '<ul>$1</ul>');
            
            // 段落
            content = content.replace(/^(?!<h|<ul|<li|<p).*$/gm, '<p>$0</p>');
            
            return content;
        }
        
        // HTML转义
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
        
        // 生成随机关键词
        function generateRandomKeywords(count = 5) {
            const shuffled = [...keywordsPool].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count).join(',');
        }
    </script>
